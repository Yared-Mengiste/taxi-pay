name: taxi_pay
description: "Track teleBirr payments received via SMS during taxi work sessions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.5
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  another_telephony: ^0.4.1
  fl_chart: ^1.2.0
  share_plus: ^13.0.0
  workmanager: ^0.10.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
